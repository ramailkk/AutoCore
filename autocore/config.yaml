# All tunable parameters for the review pipeline. Secrets (API keys/tokens)
# and per-run context (repo, PR number, head ref) stay as environment
# variables set by the GitHub Actions workflows — only static, non-secret
# settings live here.

github:
  api_url: "https://api.github.com"

groq:
  api_url: "https://api.groq.com/openai/v1/chat/completions"
  model: "openai/gpt-oss-20b"

openrouter:
  api_url: "https://openrouter.ai/api/v1/chat/completions"
  model: "qwen/qwen3-coder:free"

classify:
  max_diff_chars: 40000
  categories: ["major", "minor", "advice", "none"]
  labels:
    major: "Major"
    minor: "Minor"
    advice: "Advice"
    none: "No issues found"

kaggle:
  kernel_slug: "core-heavy-review"
  accelerator: "NvidiaTeslaT4"
  poll_interval_seconds: 20
  poll_timeout_seconds: 2400
  done_states: ["ERROR", "CANCELLED", "CANCELED", "CANCEL_ACKNOWLEDGED", "CANCEL_REQUESTED"]

profile:
  path: ".reviewer/profile.md"

risk:
  # A single-file score >= this forces category="major" before Groq is even
  # called (a deterministic safety net) — see autocore/risk.py.
  force_major_threshold: 50

  path_patterns:
    - pattern: "**/auth/**"
      points: 30
      reason: "touches auth/ code"
    - pattern: "**/migrations/**"
      points: 25
      reason: "touches a migration"
    - pattern: "**secret**"
      points: 35
      reason: "path contains 'secret'"
    - pattern: "**crypto**"
      points: 30
      reason: "path contains 'crypto'"
    - pattern: "**payment**"
      points: 35
      reason: "path contains 'payment'"

  content_patterns:
    - pattern: 'eval\('
      points: 25
      reason: "calls eval()"
    - pattern: 'exec\('
      points: 25
      reason: "calls exec()"
    - pattern: 'subprocess\.'
      points: 15
      reason: "shells out via subprocess"
    - pattern: 'except\s*:'
      points: 10
      reason: "bare except clause"
    - pattern: '(SELECT|INSERT|UPDATE|DELETE).*%s'
      points: 20
      reason: "possible raw SQL string interpolation"

  size:
    points_per_line: 0.5
    max_points: 20
